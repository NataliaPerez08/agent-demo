services:

  api:
    build: .
    container_name: app-api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - app-postgres
      - app-analytics
      - app-redis
      - litellm
      - ollama
      - mcp-glossary
      - mcp-explorer

  app-postgres:
    image: postgres:16
    container_name: app-postgres-agent
    environment:
      POSTGRES_DB: agent
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
    ports:
      - "5432:5432"
    volumes:
      - app_postgres_data:/var/lib/postgresql/data
      - ./database/agent/ddl/001_audit.sql:/docker-entrypoint-initdb.d/001_audit.sql
      - ./database/agent/ddl/002_dashboards.sql:/docker-entrypoint-initdb.d/002_dashboards.sql

  app-analytics:
    image: postgres:16
    container_name: app-postgres-analytics
    environment:
      POSTGRES_DB: analytics
      POSTGRES_USER: analytics_admin
      POSTGRES_PASSWORD: analytics_admin
    ports:
      - "5433:5432"
    volumes:
      - app_analytics_data:/var/lib/postgresql/data
      - ./database/analytics/ddl/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql
      - ./database/analytics/ddl/002_indexes.sql:/docker-entrypoint-initdb.d/002_indexes.sql
      - ./database/analytics/ddl/003_views.sql:/docker-entrypoint-initdb.d/003_views.sql
      - ./database/analytics/ddl/004_agent_role.sql:/docker-entrypoint-initdb.d/004_agent_role.sql
      - ./database/analytics/dml/001_seed.sql:/docker-entrypoint-initdb.d/005_seed.sql

  app-redis:
    image: redis:7
    container_name: app-redis
    ports:
      - "6379:6379"

  litellm-db:
    image: postgres:16
    container_name: litellm-postgres
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: litellm
    ports:
      - "5434:5432"
    volumes:
      - litellm_postgres_data:/var/lib/postgresql/data

  litellm-redis:
    image: redis:7
    container_name: litellm-redis
    ports:
      - "6380:6379"

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: litellm-proxy
    command:
      - "--config"
      - "/app/config.yaml"
      - "--port"
      - "4000"
    ports:
      - "4000:4000"
    volumes:
      - ./litellm/config.yaml:/app/config.yaml
    env_file:
      - .env
    depends_on:
      litellm-db:
        condition: service_started
      litellm-redis:
        condition: service_started
      ollama-init:
        condition: service_completed_successfully

  ollama:
    image: ollama/ollama:latest
    container_name: app-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list > /dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  ollama-init:
    image: ollama/ollama:latest
    container_name: app-ollama-init
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo ">> descargando modelos de Ollama (primera vez puede tardar)..."
        ollama pull qwen2.5:1.5b
        ollama pull qwen2.5:7b
        if ! ollama list | grep -q 'qwen2.5:1.5b'; then
          echo "!! ERROR: qwen2.5:1.5b no aparece en ollama list"
          exit 1
        fi
        echo ">> modelos listos y verificados"
    restart: "no"

  mcp-glossary:
    build: .
    container_name: app-mcp-glossary
    command: python -m mcp_servers.servers.business_glossary
    ports:
      - "8100:8100"
    volumes:
      - .:/app
    env_file:
      - .env
    restart: unless-stopped

  mcp-explorer:
    build: .
    container_name: app-mcp-explorer
    command: python -m mcp_servers.servers.analytics_explorer
    ports:
      - "8101:8101"
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - app-analytics
    restart: unless-stopped

  chatbot:
    build:
      context: .
      dockerfile: chatbot/Dockerfile
    container_name: app-chatbot
    command: chainlit run chatbot/app.py --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"
    volumes:
      - .:/app
    environment:
      - AGENT_API_URL=http://api:8000
    depends_on:
      - api
    restart: unless-stopped

volumes:
  app_postgres_data:
  app_analytics_data:
  litellm_postgres_data:
  ollama_data: