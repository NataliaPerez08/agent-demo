services:

  api:
    build: .
    container_name: analyst-api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - postgres
      - analytics
      - redis
      - litellm
      - ollama
      - mcp-glossary
      - mcp-explorer
      - mcp-glossary
      - mcp-explorer

  postgres:
    image: postgres:16
    container_name: analyst-agent-db
    environment:
      POSTGRES_DB: agent
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
    ports:
      - "5432:5432"
    volumes:
      - agent_postgres_data:/var/lib/postgresql/data
      - ./database/agent/ddl/001_audit.sql:/docker-entrypoint-initdb.d/001_audit.sql
  redis:
    image: redis:7
    container_name: analyst-redis
    ports:
      - "6379:6379"

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: analyst-litellm
    command:
      - "--config"
      - "/app/config.yaml"
      - "--port"
      - "4000"
    ports:
      - "4000:4000"
    volumes:
      - ./litellm/config.yaml:/app/config.yaml
    env_file:
      - .env
    depends_on:
      ollama-init:
        condition: service_completed_successfully

  ollama:
    image: ollama/ollama:latest
    container_name: analyst-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list > /dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  ollama-init:
    image: ollama/ollama:latest
    container_name: analyst-ollama-init
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo ">> descargando modelos de Ollama (primera vez puede tardar)..."
        # Modelo ligero primero (tests); el grande despues.
        ollama pull qwen2.5:1.5b
        ollama pull qwen2.5:7b
        # Smoke: verificar que el modelo de tests este cargado.
        if ! ollama list | grep -q 'qwen2.5:1.5b'; then
          echo "!! ERROR: qwen2.5:1.5b no aparece en ollama list"
          exit 1
        fi
        echo ">> modelos listos y verificados"
    restart: "no"

  analytics:
    image: postgres:16
    container_name: analyst-data-db

    environment:
      POSTGRES_DB: analytics
      POSTGRES_USER: analytics_admin
      POSTGRES_PASSWORD: analytics_admin

    ports:
      - "5433:5432"

    volumes:
      - analytics_postgres_data:/var/lib/postgresql/data

      - ./database/analytics/ddl/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql
      - ./database/analytics/ddl/002_indexes.sql:/docker-entrypoint-initdb.d/002_indexes.sql
      - ./database/analytics/ddl/003_views.sql:/docker-entrypoint-initdb.d/003_views.sql
      - ./database/analytics/ddl/004_agent_role.sql:/docker-entrypoint-initdb.d/004_agent_role.sql
      - ./database/analytics/dml/001_seed.sql:/docker-entrypoint-initdb.d/005_seed.sql

  mcp-glossary:
    build: .
    container_name: analyst-mcp-glossary
    command: python -m mcp_servers.servers.business_glossary
    ports:
      - "8100:8100"
    volumes:
      - .:/app
    env_file:
      - .env
    restart: unless-stopped

  mcp-explorer:
    build: .
    container_name: analyst-mcp-explorer
    command: python -m mcp_servers.servers.analytics_explorer
    ports:
      - "8101:8101"
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - analytics
    restart: unless-stopped

  chatbot:
    build:
      context: .
      dockerfile: chatbot/Dockerfile
    container_name: analyst-chatbot
    command: chainlit run chatbot/app.py --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"
    volumes:
      - .:/app
    environment:
      - AGENT_API_URL=http://api:8000
    depends_on:
      - api
    restart: unless-stopped

volumes:
  agent_postgres_data:
  analytics_postgres_data:
  ollama_data: