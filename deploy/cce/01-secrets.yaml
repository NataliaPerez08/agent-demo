apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: data-analyst-agent
type: Opaque
stringData:
  OPENAI_API_KEY: "TU_API_KEY"
  LITELLM_MASTER_KEY: "sk-local-secret"
  AGENT_DATABASE_URL: "postgresql://agent:agent@postgres-agent:5432/agent"
  ANALYTICS_DATABASE_URL: "postgresql://analyst_agent:analyst@postgres-analytics:5432/analytics"
  REDIS_URL: "redis://redis:6379/0"
  ANALYST_MODEL: "analyst-local-fast"
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-agent-credentials
  namespace: data-analyst-agent
type: Opaque
stringData:
  POSTGRES_DB: "agent"
  POSTGRES_USER: "agent"
  POSTGRES_PASSWORD: "agent"
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-analytics-credentials
  namespace: data-analyst-agent
type: Opaque
stringData:
  POSTGRES_DB: "analytics"
  POSTGRES_USER: "analytics_admin"
  POSTGRES_PASSWORD: "analytics_admin"