apiVersion: v1
kind: Service
metadata:
  name: mcp-explorer
  namespace: ${namespace}
spec:
  selector:
    app: mcp-explorer
  ports:
    - port: 8101
      targetPort: 8101
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-explorer
  namespace: ${namespace}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-explorer
  template:
    metadata:
      labels:
        app: mcp-explorer
    spec:
      containers:
        - name: mcp-explorer
          image: ${api_image}
          imagePullPolicy: Always
          command: ["python", "-m", "mcp_servers.servers.analytics_explorer"]
          ports:
            - containerPort: 8101
          envFrom:
            - secretRef:
                name: app-secrets
          readinessProbe:
            tcpSocket:
              port: 8101
            initialDelaySeconds: 5
            periodSeconds: 5