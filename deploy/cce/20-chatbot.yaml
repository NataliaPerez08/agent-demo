apiVersion: v1
kind: Service
metadata:
  name: chatbot
  namespace: data-analyst-agent
spec:
  selector:
    app: chatbot
  ports:
    - port: 8001
      targetPort: 8001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chatbot
  namespace: data-analyst-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chatbot
  template:
    metadata:
      labels:
        app: chatbot
    spec:
      containers:
        - name: chatbot
          image: swr.cn-north-4.myhuaweicloud.com/mi-org/analyst-chatbot:latest
          ports:
            - containerPort: 8001
          env:
            - name: AGENT_API_URL
              value: http://api:8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 5