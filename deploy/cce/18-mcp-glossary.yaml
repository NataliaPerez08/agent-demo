apiVersion: v1
kind: Service
metadata:
  name: mcp-glossary
  namespace: data-analyst-agent
spec:
  selector:
    app: mcp-glossary
  ports:
    - port: 8100
      targetPort: 8100
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-glossary
  namespace: data-analyst-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-glossary
  template:
    metadata:
      labels:
        app: mcp-glossary
    spec:
      containers:
        - name: mcp-glossary
          image: swr.la-north-2.myhuaweicloud.com/langchain-test/analyst-api:latest
          command: ["python", "-m", "mcp_servers.servers.business_glossary"]
          ports:
            - containerPort: 8100
          readinessProbe:
            tcpSocket:
              port: 8100
            initialDelaySeconds: 5
            periodSeconds: 5