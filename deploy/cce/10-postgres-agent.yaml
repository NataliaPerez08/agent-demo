apiVersion: v1
kind: Service
metadata:
  name: postgres-agent
  namespace: data-analyst-agent
spec:
  selector:
    app: postgres-agent
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-agent
  namespace: data-analyst-agent
spec:
  serviceName: postgres-agent
  replicas: 1
  selector:
    matchLabels:
      app: postgres-agent
  template:
    metadata:
      labels:
        app: postgres-agent
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: postgres-agent-credentials
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init-sql
              mountPath: /docker-entrypoint-initdb.d
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "agent", "-d", "agent"]
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: agent-db-data
        - name: init-sql
          configMap:
            name: agent-db-init