apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: agent-db-data
  namespace: data-analyst-agent
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: csi-disk
  resources:
    requests:
      storage: 5Gi
