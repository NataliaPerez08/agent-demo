apiVersion: v1
kind: Service
metadata:
  name: litellm-elb
  namespace: ${namespace}
  annotations:
    kubernetes.io/elb.id: "${elb_id}"
    kubernetes.io/elb.class: union
    kubernetes.io/elb.health-check-flag: "on"
    kubernetes.io/elb.health-check-option: '{"protocol":"HTTP","path":"/health/liveness","delay":"5","timeout":"3","max_retries":"3"}'
spec:
  type: LoadBalancer
  selector:
    app: litellm
  ports:
    - port: 4000
      targetPort: 4000
