apiVersion: v1
kind: Service
metadata:
  name: api-elb
  namespace: data-analyst-agent
  annotations:
    # CCE: auto-crea un ELB publico con EIP (no requiere ELB ID previo).
    kubernetes.io/elb.class: union
    kubernetes.io/elb.autocreate: |
      {
        "type": "public",
        "name": "analyst-api-elb",
        "bandwidth_name": "analyst-api-bw",
        "bandwidth_chargemode": "bandwidth",
        "bandwidth_size": 5,
        "bandwidth_sharetype": "PER",
        "eip_type": "5_bgp"
      }
    # Health check del ELB contra /health del API.
    kubernetes.io/elb.health-check-flag: "on"
    kubernetes.io/elb.health-check-option: |
      {
        "protocol": "HTTP",
        "port": 8000,
        "path": "/health",
        "delay": "5",
        "timeout": "3",
        "max_retries": "3"
      }
spec:
  type: LoadBalancer
  selector:
    app: api
  ports:
    - port: 8000
      targetPort: 8000