apiVersion: v1
kind: Service
metadata:
  name: chatbot-elb
  namespace: ${namespace}
  annotations:
    kubernetes.io/elb.id: "${elb_id}"
    kubernetes.io/elb.class: union
    kubernetes.io/elb.health-check-flag: "on"
    kubernetes.io/elb.health-check-option: '{"protocol":"HTTP","path":"/health","delay":"5","timeout":"3","max_retries":"3"}'
spec:
  type: LoadBalancer
  selector:
    app: chatbot
  ports:
    - port: 8001
      targetPort: 8001
