apiVersion: v1
kind: Service
metadata:
  name: chatbot-elb
  namespace: data-analyst-agent
  annotations:
    kubernetes.io/elb.class: union
    kubernetes.io/elb.autocreate: |
      {
        "type": "public",
        "name": "analyst-chatbot-elb",
        "bandwidth_name": "analyst-chatbot-bw",
        "bandwidth_chargemode": "bandwidth",
        "bandwidth_size": 5,
        "bandwidth_sharetype": "PER",
        "eip_type": "5_bgp"
      }
    kubernetes.io/elb.health-check-flag: "on"
    kubernetes.io/elb.health-check-option: |
      {
        "protocol": "HTTP",
        "port": 8001,
        "path": "/health",
        "delay": "5",
        "timeout": "3",
        "max_retries": "3"
      }
spec:
  type: LoadBalancer
  selector:
    app: chatbot
  ports:
    - port: 8001
      targetPort: 8001
