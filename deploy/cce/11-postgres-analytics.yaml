apiVersion: v1
kind: Service
metadata:
  name: app-postgres-analytics
  namespace: data-analyst-agent
spec:
  selector:
    app: app-postgres-analytics
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: app-postgres-analytics
  namespace: data-analyst-agent
spec:
  serviceName: app-postgres-analytics
  replicas: 1
  selector:
    matchLabels:
      app: app-postgres-analytics
  template:
    metadata:
      labels:
        app: app-postgres-analytics
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: app-postgres-analytics-credentials
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init-sql
              mountPath: /docker-entrypoint-initdb.d
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "analytics_admin", "-d", "analytics"]
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: app-analytics-db-data
        - name: init-sql
          configMap:
            name: analytics-db-init